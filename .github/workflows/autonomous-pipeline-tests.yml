name: Autonomous Pipeline Tests

on:
  push:
    branches:
      - "fix/autonomous-ai-execution-pipeline-2026-09-26"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy psutil pyarrow requests yfinance scikit-learn joblib bcrypt pytest
      - name: Compile Python sources
        run: python -m compileall -q jarvis tests
      - name: Run execution/risk wiring tests
        run: |
          python -m pytest -q             tests/test_autonomous_execution_wiring.py             tests/test_strict_risk_ceiling.py             tests/test_entry_geometry_invariants.py             tests/test_risk_ceiling_enforced.py             tests/test_position_sizing_ceiling.py             tests/test_symbol_registry.py
